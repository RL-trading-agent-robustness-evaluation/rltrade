[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rltrade"
version = "0.1.0"
description = "Adversarial Robustness Evaluation for RL Trading Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "requests>=2.30.0",
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "manifest*"]
